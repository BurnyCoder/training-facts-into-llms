[project]
# Global context: package metadata follows the Python packaging specification.
# Source: https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "training-facts-into-llms"
version = "0.1.0"
description = "Run registered Qwen single-fact experiments, and reproduce and preserve the completed Qwen3.5 study archive."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "bitsandbytes==0.50.2",
    "datasets==5.0.1",
    "flash-linear-attention==0.5.2",
    "huggingface-hub==1.26.0",
    "peft==0.20.0",
    "python-dotenv==1.2.2",
    "safetensors==0.8.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "trackio[gpu]==0.34.0",
    "transformers==5.14.1",
    "trl==1.9.2",
]

[project.scripts]
# The thin CLI delegates every operation to modular phase implementations.
training-facts-into-llms = "training_facts_into_llms.cli:main"

[build-system]
# uv_build packages the src-layout project created by `uv init --package`.
# Source: https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]
cuda-kernels = [
    "causal-conv1d==1.7.0",
]

# Native PyTorch extensions must build against the exact locked runtime Torch.
# Source: https://docs.astral.sh/uv/concepts/projects/config/#augmenting-build-dependencies
[tool.uv.extra-build-dependencies]
causal-conv1d = [
    { requirement = "torch", match-runtime = true },
]

[tool.pytest.ini_options]
# Tests import the installed src-layout package created by `uv sync`.
testpaths = ["tests"]

[tool.ruff]
# Match the pinned Python runtime and keep source/test formatting deterministic.
target-version = "py312"
line-length = 88
